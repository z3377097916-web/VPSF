### VPSF-V LLaMA-Factory DPO Configuration for Qwen2.5-VL-3B-Instruct
### Strictly matches paper Section 4.1 & Appendix B.1:
###   LoRA r=256, alpha=512, beta=0.1, lr=4e-6, cosine decay (warmup=0.05, wd=0.01),
###   2 epochs, global_batch=32 (4 GPUs * per_device=1 * grad_accum=8), DeepSpeed ZeRO-2,
###   frozen vision tower & multimodal projector.

### model
model_name_or_path: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 1003520
trust_remote_code: true

### method
stage: dpo
do_train: true
finetuning_type: lora
lora_rank: 256
lora_alpha: 512
lora_target: all
pref_beta: 0.1
pref_loss: sigmoid
freeze_vision_tower: true
freeze_multi_modal_projector: true
deepspeed: ../../configs/zero2.json

### dataset
dataset_dir: ../../work/qwen25_vl_3b/llamafactory_dpo
dataset: vpsf_v_opt4_dpo
template: qwen2_vl
cutoff_len: 2560
overwrite_cache: true
preprocessing_num_workers: 8

### output
output_dir: ../../checkpoints/qwen25-vl-3b-vpsf-v
logging_steps: 5
save_steps: 200
plot_loss: true
overwrite_output_dir: false
report_to: none

### train (4 GPUs x 1 x 8 = 32 global batch size)
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 4.0e-6
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_ratio: 0.05
weight_decay: 0.01
bf16: true
ddp_timeout: 180000000
seed: 42
